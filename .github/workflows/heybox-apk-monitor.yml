name: Heybox APK Monitor

on:
  schedule:
    - cron: "0 12 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: heybox-apk-monitor
  cancel-in-progress: false

jobs:
  analyze:
    name: Download and analyze heybox APKs
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Download APKs
        env:
          DOWNLOAD_UA: "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/126.0.0.0 Safari/537.36"
        run: |
          mkdir -p apks
          download() {
            local url="$1" out="$2" i
            for i in 1 2 3; do
              if curl -R -fL -A "$DOWNLOAD_UA" --connect-timeout 20 --speed-time 60 --speed-limit 1024 \
                  -o "$out" "$url"; then
                return 0
              fi
              echo "下载失败，第 ${i}/3 次重试: $url" >&2
              rm -f "$out"
              sleep 15
            done
            return 1
          }
          download "https://dl.max-c.com/app/heybox/heybox-release.apk" apks/heybox-release.apk
          download "https://dl.max-c.com/app/heybox/heybox-beta.apk" apks/heybox-beta.apk
          ls -lh apks

      - name: Analyze APKs and build report
        id: analyze
        env:
          TZ: Asia/Shanghai
        run: |
          AAPT2="$(ls "$ANDROID_HOME"/build-tools/*/aapt2 | sort -V | tail -n 1)"
          echo "Using aapt2: $AAPT2"
          analyze_apk() {
            local apk="$1" channel="${2:-}"
            local badging size mtime
            badging="$("$AAPT2" dump badging "$apk")"

            size="$(numfmt --to=iec --format='%.2f' --suffix=B "$(stat -c %s "$apk")")"
            mtime="$(date -r "$apk" '+%Y-%m-%d %H:%M:%S %Z')"

            local label version_name version_code pkg abi min_sdk target_sdk
            label="$(sed -n "s/^application-label:'\(.*\)'.*/\1/p" <<< "$badging" | head -n 1)"
            version_name="$(sed -n "s/^package:.*versionName='\([^']*\)'.*/\1/p" <<< "$badging" | head -n 1)"
            version_code="$(sed -n "s/^package:.*versionCode='\([^']*\)'.*/\1/p" <<< "$badging" | head -n 1)"
            pkg="$(sed -n "s/^package: name='\([^']*\)'.*/\1/p" <<< "$badging" | head -n 1)"
            abi="$(sed -n "s/^native-code: \(.*\)$/\1/p" <<< "$badging" | tr -d "'" | head -n 1)"
            min_sdk="$(sed -n "s/^minSdkVersion:'\([^']*\)'.*/\1/p" <<< "$badging" | head -n 1)"
            target_sdk="$(sed -n "s/^targetSdkVersion:'\([^']*\)'.*/\1/p" <<< "$badging" | head -n 1)"

            local sdk_line="API Level ${min_sdk}"
            case "$min_sdk" in
              23) sdk_line="API Level 23 (Android 6.0 Marshmallow 2015)" ;;
              24) sdk_line="API Level 24 (Android 7.0 Nougat 2016)" ;;
              26) sdk_line="API Level 26 (Android 8.0 Oreo 2017)" ;;
              28) sdk_line="API Level 28 (Android 9 Pie 2018)" ;;
              29) sdk_line="API Level 29 (Android 10 2019)" ;;
              30) sdk_line="API Level 30 (Android 11 2020)" ;;
              31) sdk_line="API Level 31 (Android 12 2021)" ;;
              33) sdk_line="API Level 33 (Android 13 Tiramisu 2022)" ;;
              34) sdk_line="API Level 34 (Android 14 UpsideDownCake 2023)" ;;
              35) sdk_line="API Level 35 (Android 15 VanillaIceCream 2024)" ;;
            esac
            local target_line="API Level ${target_sdk}"
            case "$target_sdk" in
              33) target_line="API Level 33 (Android 13 Tiramisu 2022)" ;;
              34) target_line="API Level 34 (Android 14 UpsideDownCake 2023)" ;;
              35) target_line="API Level 35 (Android 15 VanillaIceCream 2024)" ;;
            esac

            local perms perm_block=""
            perms="$(sed -n "s/^uses-permission: name='\([^']*\)'.*/\1/p" <<< "$badging")"
            if [ -n "$perms" ]; then
              perm_block="$(printf '%s\n' "$perms" | sed 's/^/    /')"
            fi

            if [ -n "$channel" ]; then
              echo "${channel}_version=${version_name}" >> "$GITHUB_OUTPUT"
              echo "${channel}_code=${version_code}" >> "$GITHUB_OUTPUT"
            fi

            cat <<EOF
          ### $(basename "$apk")

          | 项目 | 值 |
          | --- | --- |
          | 程式名称 | ${label} |
          | 版本名称 | ${version_name} |
          | 版本号 | ${version_code} |
          | 套件名称 | ${pkg} |
          | 支援的 ABI | ${abi} |
          | 最低支援 SDK 版本 | ${sdk_line} |
          | 目标 SDK 版本 | ${target_line} |
          | 总大小 | ${size} |
          | 修改时间 | ${mtime} |

          <details><summary>权限（$(printf '%s\n' "$perms" | grep -c .) 项）</summary>

          ${perm_block}

          </details>
          EOF
          }

          {
            echo "## $(date '+%Y-%m-%d %H:%M %Z')"
            echo
            analyze_apk apks/heybox-release.apk release
            echo
            analyze_apk apks/heybox-beta.apk beta
            echo
            echo "---"
            echo
          } | tee new-section.md >> "$GITHUB_STEP_SUMMARY"
          echo "date=$(date '+%Y%m%d')" >> "$GITHUB_OUTPUT"
          MAX_LINES=2000
          mkdir -p docs
          {
            echo "# 小黑盒官方 APK 版本监控"
            echo
            echo "每晚北京时间 20:00 自动下载并解析官方渠道 APK，APK 存档见 [Releases/heybox-apk](https://github.com/${GITHUB_REPOSITORY}/releases/tag/heybox-apk)。"
            echo
            if [ -f docs/heybox-version-report.md ]; then
              cat new-section.md
              sed -n '/^## /,$p' docs/heybox-version-report.md
            else
              cat new-section.md
            fi
          } | head -n "$MAX_LINES" > docs/heybox-version-report.md.tmp
          mv docs/heybox-version-report.md.tmp docs/heybox-version-report.md
          rm -f new-section.md

      - name: Commit report
        run: |
          if ! git status --porcelain docs/heybox-version-report.md | grep -q .; then
            echo "报告无变化，跳过提交"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/heybox-version-report.md
          git commit -m "chore: 更新小黑盒官方 APK 版本监控报告 [skip ci]"
          git push

      - name: Upload APKs to archive release
        env:
          GH_TOKEN: ${{ github.token }}
          ARCHIVE_TAG: heybox-apk
        run: |
          mkdir -p dist
          mv apks/heybox-release.apk "dist/Release-${{ steps.analyze.outputs.release_version }}(${{ steps.analyze.outputs.release_code }})-${{ steps.analyze.outputs.date }}.apk"
          mv apks/heybox-beta.apk "dist/Beta-${{ steps.analyze.outputs.beta_version }}(${{ steps.analyze.outputs.beta_code }})-${{ steps.analyze.outputs.date }}.apk"

          if ! gh release view "$ARCHIVE_TAG" >/dev/null 2>&1; then
            gh release create "$ARCHIVE_TAG" --title "小黑盒官方 APK 存档" \
              --notes "定时任务每晚下载的小黑盒官方渠道 APK 存档，文件名格式：渠道-版本名称(版本号)-yyyymmdd.apk"
          fi
          gh release upload "$ARCHIVE_TAG" dist/*.apk --clobber

          # 只保留最近 30 个附件（约 15 天），避免存档无限增长
          gh api "repos/$GITHUB_REPOSITORY/releases/tags/$ARCHIVE_TAG" \
            --jq '.assets | sort_by(.created_at) | reverse | .[30:][].id' \
          | while read -r asset_id; do
              gh api -X DELETE "repos/$GITHUB_REPOSITORY/releases/assets/$asset_id"
            done
