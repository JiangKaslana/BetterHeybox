name: Rootless APK Build

on:
  push:
    branches:
      - rootless-build
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Build debug APK
        run: |
          chmod +x gradlew
          ./gradlew clean assembleDebug \
            --project-prop VERSION_NAME="v0.6.0-rootless-test" \
            --project-prop VERSION_CODE="600001" \
            --stacktrace

      - name: Collect APK
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/debug/*.apk dist/BetterHeybox-v0.6.0-rootless-test.apk

      - name: Upload APK
        uses: actions/upload-artifact@v7
        with:
          name: BetterHeybox-v0.6.0-rootless-test
          path: dist/BetterHeybox-v0.6.0-rootless-test.apk
          retention-days: 14
