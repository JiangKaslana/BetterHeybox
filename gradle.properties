# JVM 内存与编码
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8

# AndroidX（libxposed 依赖 androidx.annotation，编译期需要）
android.useAndroidX=true
android.nonTransitiveRClass=true

# ===== 版本号（单一来源，build.gradle.kts 读取） =====
# 发布新版本时递增 VERSION_CODE（Android 据此判断升级），并同步更新 VERSION_NAME
VERSION_CODE=1
VERSION_NAME=0.2.0
